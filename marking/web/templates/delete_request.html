{% extends "base.html" %}

{% block content %}
<h1 class="block">Delete project request</h1>

<p><strong>Title:</strong> {{request.project.title}}</p>

<form method="POST">
    {% csrf_token %}
    <input type="hidden" name="v" value="{{request.id}}" />
    <input class="button is-danger" type="submit" value="Delete this request" />
</form>

{% endblock %}
