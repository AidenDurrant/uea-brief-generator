{% extends "base.html" %}

{% block content %}

<form method="POST">
    {% csrf_token %}
    
    <div class="field">
        <label class="label" for="{{ form.username.id_for_label }}">Username:</label>
    </div>

    <div class="field has-addons">
        
        <p class="control">
            {% if form.username.errors %}
                <div class="notification is-danger">{{ form.username.errors }}</div>
            {% endif %}
            <input class="input" type="text" placeholder="UEA Username" name="{{ form.username.html_name }}" id="{{ form.username.auto_id }}">
        </p>
        <p class="control">
            <a class="button is-static">@uea.ac.uk</a>
        </p>
    </div>

    <div class="field">
        <label class="label" for="{{ form.password.id_for_label }}">Password:</label>
        <div class="control">
            {% if form.password.errors %}
                <div class="notification is-danger">{{ form.password.errors }}</div>
            {% endif %}
            <input class="input" type="password" placeholder="UEA Password" name="{{ form.password.html_name }}" id="{{ form.password.auto_id }}">
        </div>
    </div>

    <div class="field">
        <div class="control">
          <input class="button is-primary is-large" type="submit" value="Login" />
        </div>
      </div>
</form>

{% endblock %}
