<!DOCTYPE html>
<html class="no-js " lang="en-GB">
<head>{% load static %}
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'bulma.min.css' %}">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="container">
        <nav class="navbar block" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <a class="navbar-item" href="/">Home</a>

                <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navMenu">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>

            <div class="navbar-menu" id="navMenu">
                <div class="navbar-start">
                    {% if supervisor %}<a class="navbar-item" href="{% url 'marking_start' %}">Marking</a>
                    <a class="navbar-item" href="{% url 'briefs_app' %}">Assessment briefs</a>{% endif %}
                </div>
                <div class="navbar-end">
                    <div class="navbar-item">
                      <div class="buttons">
                        {% if logged_in %}<a class="button is-light" href="{% url 'logout' %}">Log out</a>{% else %}<a class="button is-light" href="{% url 'login' %}">Log in</a>{% endif %}
                      </div>
                    </div>
                </div>
            </div>
        </nav>

        {% block content %}{% endblock %}
    </div>
    <footer class="footer has-background-white">
        <div class="content has-text-centered">
            <p class="is-size-7"></p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

        // Get all "navbar-burger" elements
        const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);

        // Add a click event on each of them
        $navbarBurgers.forEach( el => {
        el.addEventListener('click', () => {

            // Get the target from the "data-target" attribute
            const target = el.dataset.target;
            const $target = document.getElementById(target);

            // Toggle the "is-active" class on both the "navbar-burger" and the "navbar-menu"
            el.classList.toggle('is-active');
            $target.classList.toggle('is-active');

        });
        });

        });
    </script>
    {% block javascript %}{% endblock %}
</body>
</html>
