{% extends "base.html" %}

{% block content %}

<h2 class="title">Password reset</h2>

<form method="POST">
    {% csrf_token %}
    
    {{ form.u }}
    {{ form.id }}
    {{ form.t }}

    <div class="field">
        <label class="label" for="{{ form.new_pass_1.id_for_label }}">Password:</label>
        <div class="control">
            {% if form.new_pass_1.errors %}
                <div class="notification is-danger">{{ form.new_pass_1.errors }}</div>
            {% endif %}
            <input class="input" type="password" placeholder="New password" name="{{ form.new_pass_1.html_name }}" id="{{ form.new_pass_1.auto_id }}">
        </div>
    </div>

    <div class="field">
        <label class="label" for="{{ form.new_pass_2.id_for_label }}">Repeat password:</label>
        <div class="control">
            {% if form.new_pass_2.errors %}
                <div class="notification is-danger">{{ form.new_pass_2.errors }}</div>
            {% endif %}
            <input class="input" type="password" placeholder="Repeat password" name="{{ form.new_pass_2.html_name }}" id="{{ form.new_pass_2.auto_id }}">
        </div>
    </div>

    <div class="field">
        <label class="label" for="{{ form.new_pass_1.id_for_label }}">Password:</label>
    </div>

    <div class="field">
        <div class="control">
            <input class="button is-primary is-large" type="submit" value="Change password" />
        </div>
    </div>
</form>
{% endblock %}
